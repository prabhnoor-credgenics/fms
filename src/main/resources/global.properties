# =====================================================================
# Framework-wide settings (env-agnostic).
# Per-environment values (base URL, emails, passwords, api key company id, ...)
# live in src/main/resources/<env>.properties (e.g. stag.properties).
# =====================================================================

# --- Active environment (pick: dev | stag | prod). Override with -Denvironment=dev ---
environment=stag

# --- Authentication strategy: user | api_key_single_company | api_key_multiple_companies ---
user_type=user

# --- API client defaults ---
default.accept.type=application/json
default.content.type=application/json
api.connection.timeout=30000
api.read.timeout=60000
api.max.response.time.ms=5000
request.logging.enabled=false
response.logging.enabled=false

# --- Default request data (can be overridden per scenario) ---
loan.id=api_automation_test_1
allocation.month=2025-12-01
# --- Parallel execution (keep pool size = testng-parallel.xml thread-count) ---
parallel.execution.enabled=false
parallel.thread.count=2
parallel.user.pool.size=2

# --- Test-data strategy ---
test.data.unique.loan.id.per.scenario=true
test.data.loan.id.prefix=api_auto

# --- Auth token cache (per user slot) ---
auth.token.cache.enabled=true
auth.token.cache.ttl.minutes=30

# --- CI mode: mvn test -Dci.mode=true ---
ci.mode=false

# --- Company creation defaults (POST /user/company) ---
company.creation.alias_profile_id=icoPMIUXyTzl
company.creation.country_isd_code=+91
company.creation.gst_number=24AAACC1206D1ZM
company.creation.whitelisted_ips=103.55.60.250,103.55.60.251

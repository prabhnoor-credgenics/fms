# =====================================================================
# UAT environment configuration.
# Loaded automatically by ConfigReader when environment=uat (in global.properties)
# or -Denvironment=uat is passed on the command line.
#
# Replace base URL, company id, and credentials with values from your UAT team.
# =====================================================================

# --- API endpoint ---
uat.base.url=https://api.uat.credgenics.com

# --- API-key (multi-company) global company id ---
uat.api.key.global.company.id=REPLACE_WITH_UAT_GLOBAL_COMPANY_UUID

# --- Creator pool ---
uat.email=REPLACE_WITH_UAT_EMAIL
uat.password=REPLACE_WITH_UAT_PASSWORD

# --- Approver pool ---
uat.approver.email=REPLACE_WITH_UAT_APPROVER_EMAIL
uat.approver.password=REPLACE_WITH_UAT_APPROVER_PASSWORD
